<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Edit a movie in your watchlist">
  <title>Edit Movie — Cinememo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="style.css">

  <!-- Theme script (same as index.html — prevents flash) -->
  <script>
    (function () {
      const KEY = 'theme';
      const root = document.documentElement;
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      let animTimeout;
      function getPref() { try { const v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light' || v === 'system') ? v : 'system'; } catch (e) { return 'system'; } }
      function shouldBeDark(p) { return p === 'dark' || (p === 'system' && mq.matches); }
      function applyTheme(p) {
        root.classList.toggle('dark', shouldBeDark(p));
        try { document.querySelectorAll('[data-theme-opt]').forEach(el => el.classList.toggle('is-active', el.getAttribute('data-theme-opt') === p)); } catch (e) { }
      }
      // Public function: set theme with circular wipe transition (View Transitions API)
      window.setTheme = function (pref, event) {
        try { localStorage.setItem(KEY, pref); } catch (e) { }

        const isSwitching = shouldBeDark(pref) !== root.classList.contains('dark');
        if (!isSwitching) {
          applyTheme(pref);
          return;
        }

        // Check if browser supports View Transitions API
        if (!document.startViewTransition || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          root.classList.add('theme-transition');
          applyTheme(pref);
          clearTimeout(animTimeout);
          animTimeout = setTimeout(function () { root.classList.remove('theme-transition'); }, 450);
          return;
        }

        // Animation starts exactly where the user clicked, or defaults to top-right
        const x = (event && event.clientX) !== undefined ? event.clientX : window.innerWidth;
        const y = (event && event.clientY) !== undefined ? event.clientY : 0;

        // Calculate max radius needed to cover the screen from the click point
        const endRadius = Math.hypot(
          Math.max(x, window.innerWidth - x),
          Math.max(y, window.innerHeight - y)
        );

        // Execute transition
        const transition = document.startViewTransition(function () {
          applyTheme(pref);
        });

        // Animate the clip-path
        transition.ready.then(function () {
          document.documentElement.animate(
            {
              clipPath: [
                `circle(0px at ${x}px ${y}px)`,
                `circle(${endRadius}px at ${x}px ${y}px)`
              ]
            },
            {
              duration: 540,
              easing: 'cubic-bezier(.32,.08,.24,1)',
              pseudoElement: '::view-transition-new(root)'
            }
          );
        });
      };
      applyTheme(getPref());
      mq.addEventListener('change', () => { if (getPref() === 'system') { root.classList.add('theme-transition'); applyTheme('system'); clearTimeout(animTimeout); animTimeout = setTimeout(() => root.classList.remove('theme-transition'), 450); } });
      document.addEventListener('DOMContentLoaded', () => applyTheme(getPref()));
    })();
  </script>
</head>

<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <a href="index.html" class="header-logo" aria-label="Cinememo Home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
          <line x1="7" y1="2" x2="7" y2="22"></line>
          <line x1="17" y1="2" x2="17" y2="22"></line>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <line x1="2" y1="7" x2="7" y2="7"></line>
          <line x1="2" y1="17" x2="7" y2="17"></line>
          <line x1="17" y1="17" x2="22" y2="17"></line>
          <line x1="17" y1="7" x2="22" y2="7"></line>
        </svg>
        <span class="header-title">cine<span class="dot">.</span>memo</span>
      </a>

      <div class="header-right">
        <div class="theme-switch" role="group" aria-label="Theme">
          <button type="button" data-theme-opt="system" onclick="setTheme('system', event)" class="theme-opt"
            title="System" aria-label="System theme">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="4" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.7" />
              <path d="M9 21h6M12 17v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" data-theme-opt="light" onclick="setTheme('light', event)" class="theme-opt"
            title="Light" aria-label="Light theme">
            <svg viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7" />
              <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" data-theme-opt="dark" onclick="setTheme('dark', event)" class="theme-opt" title="Dark"
            aria-label="Dark theme">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M20 13.6A8 8 0 1 1 10.4 4a6.2 6.2 0 0 0 9.6 9.6z" stroke="currentColor" stroke-width="1.7"
                stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Toast notifications -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <main>
    <div class="edit-container">

      <!-- Back link -->
      <a href="index.html" class="back-link" aria-label="Go back to movie list">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12,19 5,12 12,5"></polyline>
        </svg>
        back to movies
      </a>

      <!-- Edit section -->
      <section class="section">
        <div class="section-header">
          <span class="section-label">Edit movie</span>
          <div class="section-line"></div>
        </div>

        <form id="edit-movie-form" class="edit-form" aria-label="Edit movie details">
          <div class="form-group">
            <label for="edit-title">Title</label>
            <input type="text" id="edit-title" placeholder="Movie title" required aria-required="true">
          </div>
          <div class="form-group">
            <label for="edit-rating">Personal Rating</label>
            <select id="edit-rating">
              <option value="">No rating</option>
              <option value="⭐️">1 Star</option>
              <option value="⭐️⭐️">2 Stars</option>
              <option value="⭐️⭐️⭐️">3 Stars</option>
              <option value="⭐️⭐️⭐️⭐️">4 Stars</option>
              <option value="⭐️⭐️⭐️⭐️⭐️">5 Stars</option>
            </select>
          </div>
          <div class="form-group">
            <label for="edit-platform">Where to Watch</label>
            <select id="edit-platform">
              <option value="">Select platform...</option>
              <option value="Netflix">Netflix</option>
              <option value="HBO">HBO / Max</option>
              <option value="Amazon Prime">Amazon Prime</option>
              <option value="Apple TV+">Apple TV+</option>
              <option value="Disney+">Disney+</option>
              <option value="Hulu">Hulu</option>
              <option value="Cinema">Cinema / Theaters</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label for="edit-notes">Personal Notes</label>
            <textarea id="edit-notes" placeholder="Jot down your thoughts, who recommended it, etc..." rows="3"
              style="background: rgb(var(--bg)); border: 1px solid rgb(var(--gray-200)); border-radius: var(--radius-md); padding: 8px 12px; font-family: var(--font-sans); font-size: 13px; color: rgb(var(--ink)); resize: vertical;"></textarea>
          </div>

          <div class="edit-actions">
            <button type="submit" class="btn btn-primary" id="btn-save">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" aria-hidden="true">
                <polyline points="20,6 9,17 4,12"></polyline>
              </svg>
              Save Changes
            </button>
            <a href="index.html" class="btn btn-secondary" id="btn-cancel">Cancel</a>
          </div>
        </form>
      </section>–

    </div>
  </main>

  <footer>
    <p><strong>CINE.MEMO</strong> is a beautifully minimalist personal watchlist designed to help you curate, rate, and
      track your favorite films without the clutter.</p>
  </footer>

  <script src="edit.js"></script>

</body>

</html>
